# Overview regions (D83): light sections beyond Australia and New Zealand. Each lists its
# countries' ParaglidingEarth sites on a map and in a list (no page per site), a short guide to how
# flying works there (guides.yaml), and links to the national bodies and other good sources.
# Europe is one region with a short entry per country. Ukraine, Belarus and Russia are left out
# for now (airspace closures and sanctions).

