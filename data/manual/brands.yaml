# Where to buy (docs/02 §5.8): brands and the Australian businesses that import, sell or service
# them, parsed by hand from the seed's brands_or_notes column (founder's research, checked
# 2026-10-08 to 10-12). Roles say only what each business publishes about itself:
#   official_importer  "official importer"        core_importer  "importer" (as it describes itself)
#   dealer             sells or represents         service_agent  "agent for"
#   certified_service  certified to service, as it publishes
# `org` is a seed legacy ID (merged shop rows point at their school, docs/10 D40).
- name: Advance
  distributors: [{ org: RTL-002, role: core_importer }, { org: SCH-021, role: service_agent }]
