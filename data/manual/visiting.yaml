# Visiting pilots (D89): businesses that help a visiting, already-qualified pilot on the ground
# (guiding, site briefings, lifts and shuttles, flight parks, gear hire), and businesses that run
# organised flying tours. Each entry comes from the business's own website (`source`, checked on
# `checked`); short evidence quotes are kept privately in docs/research/visiting/. Businesses
# already in the directory are referenced by `org` and take their name and website from it.
# Services: guiding, site-briefing, shuttle, tours, gear-hire, accommodation, flight-park,
# licence-help, tandem, courses. Facts only; never "safe" or "flyable".
