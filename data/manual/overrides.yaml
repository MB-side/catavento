# Corrections that always win over seed and collected data (docs/04 §4).
# Key: a record ID (e.g. org:au:...) or a seed legacy ID (e.g. NZ-CLB-005).
# Value: fields to set. `note` and `source` explain the change and are not copied to the record.
# Set `hidden: true` to hide a record; set `id` to pin an ID that must not change.

# New Zealand clubs: NZHGPA lists each club under a region name (https://nzhgpa.org.nz/local-clubs/,
# checked 2026-10-12). "Aorangi" and "Southern" don't name a single ISO region, so they stay unset
# until confirmed (docs/10 C21).
NZ-CLB-001: { regionCode: NZ-NTL, source: "https://nzhgpa.org.nz/local-clubs/" }
NZ-CLB-002: { regionCode: NZ-WKO, source: "https://nzhgpa.org.nz/local-clubs/" }
NZ-CLB-003: { regionCode: NZ-HKB, source: "https://nzhgpa.org.nz/local-clubs/" }
NZ-CLB-004: { regionCode: NZ-TAS, source: "https://nzhgpa.org.nz/local-clubs/" }
NZ-CLB-005: { regionCode: NZ-CAN, source: "https://nzhgpa.org.nz/local-clubs/" }
NZ-CLB-007: { regionCode: NZ-AUK, source: "https://nzhgpa.org.nz/local-clubs/" }
NZ-CLB-008: { regionCode: NZ-BOP, source: "https://nzhgpa.org.nz/local-clubs/" }
NZ-CLB-009: { regionCode: NZ-WGN, source: "https://nzhgpa.org.nz/local-clubs/" }
NZ-CLB-010: { regionCode: NZ-MBH, source: "https://nzhgpa.org.nz/local-clubs/" }

# HighSide flight park runs the Karioitahi Beach sample site, which nz-sample-sites.yaml places
# in the Auckland region.
NZ-FP-001: { regionCode: NZ-AUK, source: "https://www.highside.nz" }

# New Zealand schools: NZHGPA lists each school's town (https://nzhgpa.org.nz/finding-a-school/,
# via the seed); the region is the one that town is in. Auckland/Waikato (NZ-SCH-008) spans two
# regions, so it stays unset.
NZ-SCH-001: { regionCode: NZ-CAN, source: "https://nzhgpa.org.nz/finding-a-school/", note: "Christchurch" }
NZ-SCH-002: { regionCode: NZ-CAN, source: "https://nzhgpa.org.nz/finding-a-school/", note: "Christchurch" }
NZ-SCH-003: { regionCode: NZ-NTL, source: "https://nzhgpa.org.nz/finding-a-school/", note: "Mangawhai Heads (Kaipara District)" }
NZ-SCH-004: { regionCode: NZ-HKB, source: "https://nzhgpa.org.nz/finding-a-school/", note: "Napier" }
NZ-SCH-005: { regionCode: NZ-NSN, source: "https://nzhgpa.org.nz/finding-a-school/", note: "Nelson" }
NZ-SCH-006: { regionCode: NZ-NSN, source: "https://nzhgpa.org.nz/finding-a-school/", note: "Nelson" }
NZ-SCH-007: { regionCode: NZ-CAN, source: "https://nzhgpa.org.nz/finding-a-school/", note: "Canterbury" }

