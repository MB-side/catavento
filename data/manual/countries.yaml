# Country configuration. Every country-specific rule lives here, never in code. See docs/04 §2 (Country).
- code: AU
  name: Australia
  enabled: true
  default: true
  regionLabel: State or territory
  regions: [AU-NSW, AU-VIC, AU-QLD, AU-SA, AU-WA, AU-TAS, AU-ACT, AU-NT]
  timezones: [Australia/Sydney, Australia/Melbourne, Australia/Brisbane, Australia/Adelaide, Australia/Perth, Australia/Hobart, Australia/Darwin]
  currency: AUD
  defaultUnits: { speed: kmh, altitude: m }
  nationalBody:
    orgLegacyId: GOV-001
    name: Sports Aviation Federation of Australia (SAFA)
    url: https://safa.asn.au
    membershipLine: "Current SAFA membership is required to fly in Australia, including for visiting pilots."
    visitingPilotsUrl: ""          # fill from SAFA's visiting pilots page
    joinUrl: ""                    # fill from SAFA's join page
  ratingsNote: "Pilot ratings as published by SAFA and site guides (for example PG2, HG Supervised)."
  primarySiteSource: ansg
  coverage: full
- code: NZ
  name: New Zealand
  enabled: true
  default: false
  regionLabel: Region
  regions: [NZ-NTL, NZ-AUK, NZ-WKO, NZ-BOP, NZ-HKB, NZ-WGN, NZ-TAS, NZ-NSN, NZ-MBH, NZ-CAN, NZ-OTA, NZ-STL]
  timezones: [Pacific/Auckland]
  currency: NZD
  defaultUnits: { speed: kmh, altitude: m }
  nationalBody:
    orgLegacyId: NZ-GOV-001
    name: New Zealand Hang Gliding & Paragliding Association (NZHGPA)
    url: https://nzhgpa.org.nz
    membershipLine: "NZHGPA membership (or a visitor membership) is required to fly in New Zealand."
    visitingPilotsUrl: ""          # fill from NZHGPA's Flying in New Zealand page
    joinUrl: https://nzhgpa.org.nz/membership/
  ratingsNote: "NZ ratings as published by NZHGPA (for example Hang 2 Novice, Hang 3 Intermediate; sites rated Beginner to Advanced)."
  primarySiteSource: manual+pge
  coverage: sample             # Iteration 1 shows a "Sample coverage" notice on NZ pages
