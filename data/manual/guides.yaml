      url: https://service.dhv.de/db3/gelaende
    - label: DHV school search
      url: https://service.dhv.de/db1/addressessearchpage.php?lang=EN&addressestype=school
    - label: "ParaglidingEarth: Germany"
      url: https://www.paraglidingearth.com/?country=de
    - label: XContest Germany
      url: https://www.xcontest.org/germany/
  sources:
