- code: GB
  name: United Kingdom
  nationalBody:
    name: British Hang Gliding and Paragliding Association (BHPA)
    url: https://www.bhpa.co.uk/
  visitors:
    - Carry proof of suitable third-party insurance; BHPA members have £5 million cover, and most UK sites were negotiated on that basis.
    - Be ready to show an IPPI card proving you are suitably qualified to fly a particular site.
    - Sites are run by about 60 local BHPA clubs with their own rules; some are members-only, which requires BHPA membership (short-term options exist).
    - Check NOTAMs every time you fly, carry an up-to-date aeronautical chart for cross-country, and don't use 144 MHz ham radio in flight.
  learners:
    - The BHPA says initial instruction should always be at a BHPA registered school; find one by postcode or on its map.
    - BHPA registered schools are monitored by the BHPA, their instructors are licensed by it, and students take out BHPA membership.
    - By law you must be at least 14 to attempt solo flight; many schools set a higher minimum age, often around 16.
  links:
