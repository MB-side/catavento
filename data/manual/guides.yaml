- code: IT
  name: Italy
  nationalBody:
    name: FIVL (Federazione Italiana Volo Libero)
    url: https://www.fivl.it/
  visitors:
    - Visiting pilots should carry their IPPI card so clubs can check their
      level. Third-party liability insurance is a legal requirement.
    - FIVL sells a 30-day liability policy for foreign pilots whose own cover
      falls short. Contact the clubs in the region before you fly.
  rulesUrl: https://www.fivl.it/foreign-pilots/rules-for-hg-pg-pilots
  learners:
    - The free flight licence (attestato di volo libero) can only be obtained at
      schools certified by the Aero Club d'Italia. FIVL publishes the list.
    - To be issued the licence (VDS attestato), you need a clearance (nulla
      osta) from the Questore (police) of your home province.
    - The police clearance doesn't replace the medical fitness certificate
      needed to join a course.
  links:
    - label: FIVL
      url: https://www.fivl.it/
