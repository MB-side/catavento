    - https://papillon.de/wasserkuppe/fluggebiete-rhoen/
  checked: 2026-10-13
  practice:
    - At Tegelberg and Buchenberg, every paraglider and hang glider pilot needs
      a site-briefing card, the 'green card', issued through the local flight
      school. Pilots show it to lift staff.
    - At the Wasserkuppe, guest pilots register once on the local club's website
      and buy day tickets there. The club posts any temporary limits on guest
      flying.
- code: AT
  name: Austria
  nationalBody:
    name: Österreichischer Aero-Club (ÖAeC), hang gliding and paragliding section
    url: https://aeroclub.at/de/sportverband/sektionen/haenge-paragleiten
  visitors:
    - You need a recognised licence. Licences from 20 listed countries,
      including Australia, Germany, Italy and Switzerland, are accepted without
      separate recognition.
    - This does not cover tandem or powered flying. Pilots with other licences
      can apply to the Austrian Aero Club (ÖAeC) for validation.
  rulesUrl: https://aeroclub.at/uploads/download/GasteflugVO__Fassung_vom_01_03_2017.pdf
  learners:
    - Choose a flight school approved by ÖAeC. ÖAeC publishes the list of
      approved hang gliding and paragliding schools.
    - The minimum age is 15. No medical certificate is needed, but you must meet
      the fitness criteria.
    - The basic licence is issued for each launch method (slope or winch).
      Cross-country flying needs a separate cross-country rating.
  links:
