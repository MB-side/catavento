- code: CH
  name: Switzerland
  nationalBody:
    name: Swiss Hang Gliding and Paragliding Association (SHV/FSVL)
    url: https://www.shv-fsvl.ch/en/
  visitors:
    - Pilots living abroad may fly occasionally with an IPPI card at level IV or V. Commercial tandem flying and instructing need Swiss licences.
    - Liability insurance with at least CHF 1 million of cover is compulsory. The SHV sells guest cover for 30 days or up to 120 consecutive days.
    - Every glider flown in Switzerland needs a registration number at least 40 cm high on its underside. The SHV issues one free, with no membership needed.
    - Every airspace user is required by law to check the daily airspace bulletin (DABS) and current NOTAMs.
  learners:
    - Training is done at SHV-certified flight schools. You start on a practice slope, then make high flights supervised by an instructor over the radio.
    - The licence exam has a theory test in five subjects and a practical exam. Paraglider pilots need at least 50 high flights from at least 5 sites first.
    - The minimum age is 14 for training flights and the theory exam, and 16 for the practical exam.
