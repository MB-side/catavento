- code: ES
  name: Spain
  nationalBody:
    name: Real Federación Aeronáutica Española (RFAE)
    url: https://rfae.es/
  visitors:
    - Spain's aviation authority (AESA) says no aviation law sets a pilot
      licence for paragliders and hang gliders.
    - Depending on the region and its sports federation, some document may be
      required, so check locally before flying.
  rulesUrl: https://www.seguridadaerea.gob.es/es/ambitos/aviacion-general/ala-delta-parapente-y-paramotor
  learners:
    - RFAE rules say you train at a school recognised by the RFAE or a regional
      federation, holding a federation licence from day one.
    - Under RFAE rules you need at least RFAE level 4 certification to fly as an
      independent pilot.
    - The RFAE publishes a list of paragliding schools by region; schools do not
      have to be RFAE-certified to operate.
  links:
