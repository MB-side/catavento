    - https://www.bhpa.co.uk/clubs
    - https://www.bhpa.co.uk/schools
    - https://bhpa.co.uk/sport/learn_to_fly
    - https://www.cumbriasoaringclub.co.uk/about-us
  checked: 2026-10-13
  practice:
    - UK sites are looked after by local BHPA clubs, so visiting pilots should
      contact the club for the area first; it can brief them on sites and local
      rules. Overseas pilots need proof of third-party insurance and an IPPI
      card.
    - In the Lake District, Cumbria Soaring Club sites are open to visiting
      pilots without membership, as long as they follow the club's online sites
      guide.
- code: IE
  name: Ireland
  nationalBody:
    name: Irish Hang Gliding and Paragliding Association (IHPA)
    url: https://www.ihpa.ie/
  visitors:
    - Visitors can join the IHPA as a free Visiting Pilot member, for up to 90
      days in a calendar year.
    - All pilots must sign the IHPA Waiver of Indemnity and hold appropriate
      third-party insurance.
  rulesUrl: https://ihpa.ie/index.php/home/advice-for-visiting-pilots
  learners:
    - The IHPA doesn't run training; to learn paragliding you go to an
      IHPA-approved school, which it lists on its site.
    - In Ireland the minimum rating to fly unsupervised is Para Pro 3 (Novice);
      students and novices fly under a nominated coach.
