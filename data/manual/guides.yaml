# How flying works in each overview country (D83): short facts from official sources (national
# federations, civil aviation authorities, FAI/CIVL), each guide with its sources and the date it
# was checked. Researched 2026-10-13; the evidence (a quoted line per fact) is kept privately in
# docs/research/m9-guides/. The daily health check asks for a re-check after 12 months.
# Never "safe" or "flyable"; facts only. Countries without a confirmed fact have no guide yet.
- code: europe
  name: Europe
  visitors:
    - Hang gliding and paragliding rules are set by each country, so licence, insurance and airspace requirements differ from one country to the next.
    - EU aviation law leaves the airworthiness and insurance rules for hang gliders and paragliders to each country.
    - Many countries have guest rules that let visiting pilots fly if they hold an IPPI card. Check each country's guest rules before you travel.
    - The IPPI card, from FAI/CIVL via national associations, shows your skill level abroad, but it is valid only with a current national licence or rating card.
    - The IPPI card gives no insurance cover. Countries such as France and Switzerland make third-party liability insurance compulsory.
  learners: []
  links:
    - label: IPPI card (FAI/CIVL)
      url: https://www.fai.org/page/civl-ippi-card
    - label: "EHPU: links to each country's rules for visiting pilots"
      url: https://www.ehpu.org/
    - label: XContest cross-country flights
      url: https://www.xcontest.org/world/en/
    - label: ParaglidingEarth site guide
      url: https://www.paraglidingearth.com/
  sources:
    - https://www.ehpu.org/policy
    - https://www.ehpu.org/
    - https://www.fai.org/page/civl-ippi-card
    - https://www.fai.org/page/civl-ippi-FRA
    - https://www.fai.org/page/civl-ippi-SUI
    - https://www.shv-fsvl.ch/en/education/foreign-licence/
  checked: 2026-10-13
- code: FR
  name: France
  nationalBody:
    name: Fédération Française de Vol Libre (FFVL)
    url: https://federation.ffvl.fr/
  visitors:
    - The IPPI card is accepted in France. Third-party liability insurance is compulsory, but no minimum amount of cover is set.
    - French rules also require the landowner's agreement for the take-off and landing places you use.
    - Foreign pilots can join the FFVL and get the same insurance cover as French members, but need a medical certificate in French from a doctor registered in Europe.
    - You may not fly in class A–D airspace, prohibited areas or active restricted areas, or above 3450 m except in authorised parts of the Alps and Pyrenees.
  learners:
    - The FFVL awards its school label for one season at a time. EFVL schools are run by state-qualified professionals and club-schools (CEFVL) by volunteer federation-qualified instructors.
    - More than 200 professional schools belong to the FFVL network. You can find one on the FFVL school map.
    - Training follows three FFVL brevets (initial, pilot and confirmed pilot), each with practical modules and a multiple-choice theory exam.
  links:
