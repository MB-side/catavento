- code: ES
  name: Spain
  nationalBody:
    name: Real Federación Aeronáutica Española (RFAE)
    url: https://rfae.es/
  visitors:
    - Spain's aviation authority (AESA) says no aviation law sets a pilot licence or on-board documents for paragliders and hang gliders.
    - AESA notes that, depending on the region and its sports federation, some document may be required, so check locally before flying.
    - Fly by day under visual flight rules, outside controlled, restricted and prohibited airspace, active danger areas, towns and crowds.
    - The maximum is 10,000 ft pressure altitude; up to 13,000 ft is allowed for less than 30 minutes in total.
  learners:
    - RFAE rules say you train at a school recognised by the RFAE or a regional federation, holding a federation licence from day one.
    - Under RFAE rules you need at least RFAE level 4 certification to fly as an independent pilot.
    - The RFAE publishes a list of paragliding schools by region; schools do not have to be RFAE-certified to operate.
  links:
