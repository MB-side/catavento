# How flying works in each overview country (D83): short facts from official sources (national
# federations, civil aviation authorities, FAI/CIVL), each guide with its sources and the date it
# was checked. Researched 2026-10-13; the evidence (a quoted line per fact) is kept privately in
# docs/research/m9-guides/. The daily health check asks for a re-check after 12 months.
# Never "safe" or "flyable"; facts only. Countries without a confirmed fact have no guide yet.
- code: europe
  name: Europe
  visitors:
    - Rules for visiting pilots are set by each country, so licence and
      insurance requirements differ from one country to the next.
    - Many countries let visitors fly with an IPPI card plus a current national
      licence. The IPPI card gives no insurance cover.
  rulesUrl: https://www.ehpu.org/
  learners: []
  links:
    - label: IPPI card (FAI/CIVL)
      url: https://www.fai.org/page/civl-ippi-card
    - label: "EHPU: links to each country's rules for visiting pilots"
      url: https://www.ehpu.org/
    - label: XContest cross-country flights
      url: https://www.xcontest.org/world/en/
    - label: ParaglidingEarth site guide
      url: https://www.paraglidingearth.com/
  sources:
    - https://www.ehpu.org/policy
    - https://www.ehpu.org/
    - https://www.fai.org/page/civl-ippi-card
    - https://www.fai.org/page/civl-ippi-FRA
    - https://www.fai.org/page/civl-ippi-SUI
    - https://www.shv-fsvl.ch/en/education/foreign-licence/
  checked: 2026-10-13
- code: FR
  name: France
  nationalBody:
    name: Fédération Française de Vol Libre (FFVL)
    url: https://federation.ffvl.fr/
  visitors:
    - The IPPI card is accepted in France, and third-party liability insurance
      is compulsory.
    - Foreign pilots can join the FFVL and get the same insurance cover as
      French members.
  rulesUrl: https://federation.ffvl.fr/french-flying-rules
  learners:
    - The FFVL awards its school label for one season at a time. EFVL schools
      are run by state-qualified professionals and club-schools (CEFVL) by
      volunteer federation-qualified instructors.
    - More than 200 professional schools belong to the FFVL network. You can
      find one on the FFVL school map.
    - Training follows three FFVL brevets (initial, pilot and confirmed pilot),
      each with practical modules and a multiple-choice theory exam.
  links:
    - label: FFVL (national federation)
      url: https://federation.ffvl.fr/
    - label: French flying rules in English (FFVL)
      url: https://federation.ffvl.fr/french-flying-rules
