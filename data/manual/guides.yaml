- code: AT
  name: Austria
  nationalBody:
    name: Österreichischer Aero-Club (ÖAeC), hang gliding and paragliding section
    url: https://aeroclub.at/de/sportverband/sektionen/haenge-paragleiten
  visitors:
    - You need a recognised licence to fly in Austria. The Austrian Aero Club (ÖAeC) is the aviation authority for hang gliding and paragliding.
    - Austria's Guest Flight Regulation accepts licences from 20 listed countries, including Australia, Germany, Italy and Switzerland, without separate recognition.
    - This general acceptance does not cover tandem or powered flying. Pilots with other licences can apply to ÖAeC for validation, or get a one-year certificate from an approved Austrian school.
  learners:
    - Choose a flight school approved by ÖAeC. ÖAeC publishes the list of approved hang gliding and paragliding schools.
    - The minimum age is 15. No medical certificate is needed, but you must meet the fitness criteria.
    - The basic licence is issued for each launch method (slope or winch). Cross-country flying needs a separate cross-country rating.
