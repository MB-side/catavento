  nationalBody:
    name: United States Hang Gliding and Paragliding Association (USHPA)
    url: https://www.ushpa.org/
  visitors:
    - Visitors can join USHPA with a temporary 10-day membership, which includes
      the liability insurance most landowners require.
    - Without a USHPA rating, carry your home-country rating documents and a
      valid IPPI card. Chapters that manage sites set minimum ratings.
  rulesUrl: https://www.ushpa.org/USHPA/Pilot_Resources/Public/pilotresources/international-pilot-information.aspx
  learners:
    - Start with a USHPA-certified instructor, who activates a 60-day Student
      membership or provides a temporary 10-day membership.
    - USHPA student pilots must be at least 14, and 16 to gain solo ratings.
    - USHPA ratings run from level 1 (beginner) to 5 (master) for each wing
      type, and need minimum flights, hours and written tests.
  links:
    - label: USHPA (national association)
      url: https://www.ushpa.org/
    - label: International and visiting pilots (USHPA)
      url: https://www.ushpa.org/USHPA/Pilot_Resources/Public/pilotresources/international-pilot-information.aspx
    - label: Find a chapter (USHPA)
      url: https://www.ushpa.org/USHPA/Pilot_Resources/chapters/Public/PilotResources/Chapters.aspx?hkey=5e0f83c4-b56c-478c-84f0-9cca441b9a17
    - label: Find a school or instructor (USHPA)
      url: https://www.ushpa.org/USHPA/Learn_to_fly/Find_a_school/Public/LearnToFly/find-a-school-or-instructor.aspx?hkey=c77fddb0-cfc1-4489-91d6-27d39ca321a5
    - label: FAA resources (USHPA)
      url: https://www.ushpa.org/USHPA/Pilot_Resources/FAA_Resources/Public/PilotResources/faa-resources.aspx?hkey=0b3582c2-0ff1-42fa-929e-b4904a95d92b
    - label: FAA Part 103 (eCFR)
      url: https://www.ecfr.gov/current/title-14/chapter-I/subchapter-F/part-103
  sources:
    - https://www.ushpa.org/USHPA/Pilot_Resources/Public/pilotresources/international-pilot-information.aspx
    - https://www.ushpa.org/USHPA/Pilot_Resources/chapters/Public/PilotResources/Chapters.aspx?hkey=5e0f83c4-b56c-478c-84f0-9cca441b9a17
    - https://www.ushpa.org/USHPA/Learn_to_fly/Become_a_pilot/Public/LearnToFly/become-a-pilot.aspx?hkey=e12ace22-bbe5-4838-b12e-764680618303
    - https://www.ushpa.org/USHPA/Pilot_Resources/FAA_Resources/Public/PilotResources/faa-resources.aspx?hkey=0b3582c2-0ff1-42fa-929e-b4904a95d92b
    - https://www.ecfr.gov/current/title-14/chapter-I/subchapter-F/part-103
    - https://www.flytorrey.com/visiting-pilot/
  checked: 2026-10-13
  practice:
    - Torrey Pines Gliderport asks foreign pilots for P3-equivalent experience
      (IPPI card, 150 flights, 50 hours), a quick ground-handling review with an
      instructor and a logbook check before flying.
- code: CA
  name: Canada
  nationalBody:
    name: Hang Gliding and Paragliding Association of Canada (HPAC/ACVL)
    url: https://hpac.ca/
  visitors:
    - Visitors need a 60-day temporary HPAC membership to fly most sites.
      Landowners require Canadian insurance; home-association insurance is not
      valid as primary cover.
    - Only Banff, Jasper, Kootenay and Yoho national parks allow free flight;
      all other national parks are closed to it.
  rulesUrl: https://hpac.ca/pilot/visiting-pilots/
  learners:
    - Learn with an HPAC-certified instructor or school; your instructor sends
      in your HPAC membership application and rating form.
    - Passing Transport Canada's HAGAR air-law exam is required before the
      Intermediate (P3 or H3) rating.
  links:
    - label: HPAC/ACVL (national association)
      url: https://hpac.ca/
    - label: Visiting pilots (HPAC)
      url: https://hpac.ca/pilot/visiting-pilots/
    - label: Schools (HPAC)
      url: https://hpac.ca/schools/
    - label: Find an instructor (HPAC)
      url: https://hpac.ca/find-a-instructors/
    - label: Flying in national parks (HPAC)
      url: https://hpac.ca/pilot/flying-in-canadas-national-parks/
    - label: HAGAR exam (HPAC)
      url: https://hpac.ca/hagar/
    - label: Canadian Aviation Regulations
      url: https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/FullText.html
  sources:
    - https://hpac.ca/pilot/visiting-pilots/
    - https://hpac.ca/medical-certificate/
    - https://hpac.ca/hagar/
    - https://hpac.ca/pilot/transport-canada-air-regulations-and-hagar/
    - https://hpac.ca/pilot/flying-in-canadas-national-parks/
    - https://hpac.ca/joining-hpac-for-the-first-time/
    - https://laws-lois.justice.gc.ca/eng/regulations/SOR-96-433/FullText.html
  checked: 2026-10-13
  practice:
    - Visiting pilots need a 60-day temporary HPAC membership for Canadian
      insurance to fly most sites, and HPAC advises contacting local pilots, a
      school or the club for a site orientation.
- code: ID
  name: Indonesia
  nationalBody:
    name: Federasi Aero Sport Indonesia (FASI)
    url: https://pbfasi.id/
  visitors:
    - All visiting pilots need current FASI Paralayang membership. The Visiting
      Pilot Membership is free for pilots with a current home-country licence.
    - PB FASI says valid international insurance is mandatory.
  rulesUrl: https://pbfasi.id/foreign-pilot-registration/
  learners:
    - FASI's paragliding committee advises finding an instructor or school near
      you, then joining a local paragliding club.
  links:
