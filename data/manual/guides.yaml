- code: LI
  name: Liechtenstein
  nationalBody:
    name: SHV/FSVL (Swiss Hang Gliding Association), whose rules cover Liechtenstein
    url: https://www.shv-fsvl.ch/en/
  visitors:
    - Liechtenstein applies Swiss aviation law under a 2003 agreement with Switzerland. Switzerland's Federal Office of Civil Aviation (FOCA/BAZL) acts as its aviation authority.
    - SHV's guest rules for pilots living outside Switzerland and Liechtenstein allow occasional solo flights with an IPPI card at level IV or V.
    - Liability insurance with at least CHF 1 million cover is compulsory.
    - A foreign tandem licence allows occasional, non-commercial tandem flights. Commercial tandem flights need a Swiss licence.
  learners:
    - Once you live in Liechtenstein, you need a Swiss licence in the matching category.
    - Training is offered by SHV-certified flight schools, which SHV lists on its website.
