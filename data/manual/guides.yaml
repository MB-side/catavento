- code: IE
  name: Ireland
  nationalBody:
    name: Irish Hang Gliding and Paragliding Association (IHPA)
    url: https://www.ihpa.ie/
  visitors:
    - Join the IHPA as a free Visiting Pilot member; it lasts 90 days in any calendar year if you aren't normally resident.
    - All pilots must sign the IHPA Waiver of Indemnity and hold appropriate third-party insurance covering property or livestock damage.
    - Don't enter Class C airspace without air traffic control permission; some sites are restricted by airspace or minimum experience.
    - Tandem flights for reward and paramotoring need a licence from the Irish Aviation Authority.
  learners:
    - The IHPA doesn't run training; to learn paragliding you go to an IHPA-approved school, which it lists on its site.
    - In Ireland the minimum rating to fly unsupervised is Para Pro 3 (Novice); students and novices fly under a nominated coach.
