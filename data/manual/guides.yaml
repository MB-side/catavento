      url: https://service.dhv.de/db3/gelaende
    - label: burnair map
      url: https://www.burnair.ch/
    - label: "ParaglidingEarth: Italy"
      url: https://www.paraglidingearth.com/?country=it
    - label: XContest cross-country flights
      url: https://www.xcontest.org/world/en/
  sources:
