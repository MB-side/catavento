- code: CA
  name: Canada
  nationalBody:
    name: Hang Gliding and Paragliding Association of Canada (HPAC/ACVL)
    url: https://hpac.ca/
  visitors:
    - Visitors need a temporary HPAC membership, valid for 60 days, to fly most Canadian sites.
    - Insurance from your home association is not valid in Canada as primary cover; landowners require all pilots to carry Canadian insurance.
    - Canadian Aviation Regulations (CAR 602.29) ban night flying; HPAC says controlled airspace also needs a Category 4 medical certificate and a pass in the HAGAR exam.
    - Only Banff, Jasper, Kootenay and Yoho national parks allow free flight, each under Parks Canada rules; all other national parks are closed to it.
  learners:
    - Learn with an HPAC-certified instructor or school; your instructor sends in your HPAC membership application and rating form.
    - Passing Transport Canada's HAGAR air-law exam is required before the Intermediate (P3 or H3) rating.
