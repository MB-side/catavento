- code: GB
  name: United Kingdom
  nationalBody:
    name: British Hang Gliding and Paragliding Association (BHPA)
    url: https://www.bhpa.co.uk/
  visitors:
    - Visitors need proof of suitable third-party insurance and should be ready
      to show an IPPI card proving they are qualified for a site.
    - Sites are run by local BHPA clubs with their own rules. Some are
      members-only, which requires BHPA membership (short-term options exist).
  rulesUrl: https://www.bhpa.co.uk/safety/visitors
  learners:
    - The BHPA says initial instruction should always be at a BHPA registered
      school; find one by postcode or on its map.
    - BHPA registered schools are monitored by the BHPA, their instructors are
      licensed by it, and students take out BHPA membership.
    - By law you must be at least 14 to attempt solo flight; many schools set a
      higher minimum age, often around 16.
  links:
    - label: BHPA (national association)
      url: https://www.bhpa.co.uk/
    - label: "BHPA: visiting overseas pilots"
      url: https://www.bhpa.co.uk/safety/visitors
    - label: BHPA info for visiting pilots (PDF)
      url: https://www.bhpa.co.uk/pdf/Info_For_Visiting_Pilots.pdf
    - label: BHPA club finder and map
      url: https://www.bhpa.co.uk/clubs
    - label: BHPA registered school finder
      url: https://www.bhpa.co.uk/schools
  sources:
