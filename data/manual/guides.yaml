# Visiting pilots (D89): a guide for any trip, and the rules for overseas visitors to Australia and
# New Zealand from SAFA and NZHGPA (researched 2026-10-16; evidence in docs/research/visiting/).
- code: world
  name: Anywhere
  visitors:
    - The IPPI card, from FAI/CIVL via national associations, shows your skill
      level abroad, but is valid only with a current national licence or rating
      card.
    - The IPPI card gives no insurance cover. Check what insurance the country
      you visit requires.
  rulesUrl: https://www.fai.org/page/civl-ippi-card
  learners: []
  links:
    - label: IPPI card (FAI/CIVL)
      url: https://www.fai.org/page/civl-ippi-card
    - label: Paragliding Map (site guide)
      url: https://www.paraglidingmap.com/
  sources:
    - https://www.fai.org/page/civl-ippi-card
  checked: 2026-10-13
  practice:
    - Local pilots are often the best source of a site briefing. Site guides
      such as Paragliding Map list a local contact for many sites, and pilots
      often message them before visiting, commonly by WhatsApp.
- code: AU
  name: Australia
  nationalBody:
    name: Sports Aviation Federation of Australia (SAFA)
    url: https://safa.asn.au/
  visitors:
    - Overseas pilots must hold SAFA Visiting Pilot Membership and SAFA
      authorisation before flying. It includes compulsory third-party insurance.
    - You need a current overseas licence and ratings (IPPI, APPI or similar),
      and must complete SAFA's visiting pilot workbook and exam.
    - Most sites do not need local club membership, but some do.
  rulesUrl: https://safa.asn.au/pilot-tools/visiting-international-pilots/
  learners: []
  links:
    - label: Visiting international pilots (SAFA)
      url: https://safa.asn.au/pilot-tools/visiting-international-pilots/
    - label: Visiting pilot information pack (PDF)
      url: https://members.safa.asn.au/isonic-downloaddoc.php?docid=0X0X1X1X47OTh0NE5kdkpISzdqNDlpUkFWa1Ewdz09
    - label: Apply for membership online
      url: https://members.safa.asn.au/safa_register_start.php
    - label: Find a club
      url: https://safa.asn.au/local-clubs/
    - label: Find a school
      url: https://safa.asn.au/training/flight-schools/
    - label: Australian National Site Guide
      url: https://siteguide.org.au/
    - label: CASA rules for self-administering organisations (Part 149)
      url: https://www.casa.gov.au/rules/regulatory-framework/casr/part-149-casr-approved-self-administering-organisations
  sources:
    - https://safa.asn.au/pilot-tools/visiting-international-pilots/
    - https://members.safa.asn.au/isonic-downloaddoc.php?docid=0X0X1X1X47OTh0NE5kdkpISzdqNDlpUkFWa1Ewdz09
    - https://siteguide.org.au/
  checked: 2026-10-16
  practice:
    - SAFA asks visiting pilots to contact the club that manages a site before
      their first flights there, for its rules and hazards, and to report to the
      duty pilot if one is appointed.
- code: NZ
  name: New Zealand
  nationalBody:
    name: New Zealand Hang Gliding and Paragliding Association (NZHGPA)
    url: https://nzhgpa.org.nz/
  visitors:
    - NZHGPA membership, which includes public liability insurance, is required
      by law to fly. Visiting pilot membership suits stays under 4 months.
    - Accepted qualifications include an IPPI card at level 4 or above with a
      current national licence. You must also pass an online VFR exam.
    - Some sites need a site induction or permit first.
  rulesUrl: https://nzhgpa.org.nz/flying-in-nz/
  learners: []
  links:
    - label: Flying in New Zealand (NZHGPA)
      url: https://nzhgpa.org.nz/flying-in-nz/
    - label: Membership and fees
      url: https://nzhgpa.org.nz/membership/
    - label: Join online
      url: https://member.nzhgpa.org.nz/join-us
    - label: Local clubs
      url: https://nzhgpa.org.nz/local-clubs/
    - label: Find a school
      url: https://nzhgpa.org.nz/finding-a-school/
    - label: Site inductions and airspace
      url: https://nzhgpa.org.nz/site-inductions/
    - label: Emergency information
      url: https://nzhgpa.org.nz/safety/
  sources:
    - https://nzhgpa.org.nz/flying-in-nz/
    - https://nzhgpa.org.nz/membership/
    - https://nzhgpa.org.nz/site-inductions/
  checked: 2026-10-16
  practice:
    - NZHGPA advises checking with local pilots through a club or school before
      flying a new site. Many site names and locations are deliberately not
      published.
