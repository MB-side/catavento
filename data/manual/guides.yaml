- code: NO
  name: Norway
  nationalBody:
    name: Norges Luftsportforbund (NLF), Hang-, para- og speedglider section (HPS)
    url: https://nlf.no/grener/hps/
  visitors:
    - Visiting pilots who belong to a foreign hang gliding or paragliding organisation and hold a valid licence may fly as guests for up to 6 months.
    - Carry your licence and proof of third-party insurance, and show them on request. NLF also recognises the IPPI system.
    - Tandem flights with friends and family are allowed, but commercial tandem flights by visitors are not.
    - Anyone with a Norwegian address must hold a Norwegian licence, whatever their nationality.
  learners:
    - Beginner training happens in clubs affiliated with NLF, as an intensive course over 9 to 12 days or as weekend courses.
    - To fly you must be a member of an NLF club, NLF and the HPS section, with compulsory accident and liability insurance.
  links:
