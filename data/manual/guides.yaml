- code: PT
  name: Portugal
  nationalBody:
    name: Federação Portuguesa de Voo Livre (FPVL)
    url: https://www2021.fpvl.pt/
  visitors:
    - Portuguese law requires free-flight pilots to hold third-party liability
      insurance.
    - FPVL treats valid licences from FAI-member national bodies as equal to its
      local-flight licence without thermal flying; higher levels need more.
  rulesUrl: https://www2021.fpvl.pt/legislacao-e-regulamentos/
  learners:
    - The FPVL says learners should choose an FPVL-certified school using
      certified instructors and approved teaching methods.
    - Personal accident and liability insurance is compulsory for pilots,
      instructors and students during all stages of flight training.
    - The FPVL publishes its list of member schools online, showing each
      school's permit status.
  links:
