- code: IT
  name: Italy
  nationalBody:
    name: FIVL (Federazione Italiana Volo Libero)
    url: https://www.fivl.it/
  visitors:
    - FIVL tells visiting pilots to carry their IPPI card so clubs can check their level, and says level 4 is the minimum for cross-country flying.
    - Third-party liability insurance is a legal requirement. FIVL's visitor page gives a minimum cover of EUR 1.6 million.
    - If your own cover falls short, FIVL sells a renewable 30-day liability policy for foreign pilots that is valid in Italy only.
    - Contact the clubs in the region before you fly. Site managers can set restrictions, and ignoring them breaks the law.
  learners:
    - The free flight licence (attestato di volo libero) can only be obtained at schools certified by the Aero Club d'Italia. FIVL publishes the list.
    - To be issued the licence (VDS attestato), you need a clearance (nulla osta) from the Questore (police) of your home province.
    - The police clearance doesn't replace the medical fitness certificate needed to join a course.
