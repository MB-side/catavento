    - At Saint-André-les-Alpes, the local school says visiting pilots are
      welcome on the Chalvet site and that it will tell them about the day's
      conditions and the site's features. Shuttles run by the local club and the
      commune leave from the school.
- code: CH
  name: Switzerland
  nationalBody:
    name: Swiss Hang Gliding and Paragliding Association (SHV/FSVL)
    url: https://www.shv-fsvl.ch/en/
  visitors:
    - Pilots living abroad may fly occasionally with an IPPI card at level IV or
      V. Commercial tandem flying and instructing need Swiss licences.
    - Liability insurance is compulsory, and every glider needs a registration
      number, which the SHV issues free.
  rulesUrl: https://www.shv-fsvl.ch/en/education/foreign-licence/
  learners:
    - Training is done at SHV-certified flight schools. You start on a practice
      slope, then make high flights supervised by an instructor over the radio.
    - The licence exam has a theory test in five subjects and a practical exam.
      Paraglider pilots need at least 50 high flights from at least 5 sites
      first.
    - The minimum age is 14 for training flights and the theory exam, and 16 for
      the practical exam.
  links:
    - label: SHV/FSVL (national federation)
      url: https://www.shv-fsvl.ch/en/
    - label: SHV rules for foreign guest pilots
      url: https://www.shv-fsvl.ch/en/education/foreign-licence/
