- code: DE
  name: Germany
  nationalBody:
    name: DHV (Deutscher Gleitschirmverband und Drachenflugverband)
    url: https://www.dhv.de/en/
  visitors:
    - If you live outside Germany, you can fly there with your home licence plus an FAI IPPI card at stage 4 or 5. Stage 4 does not allow cross-country flights.
    - You must hold third-party liability insurance. DHV's English rules page gives a minimum cover of 750,000 SDR (special drawing rights).
    - Carry a ready-to-use reserve parachute and wear a helmet. Paragliding pilots must also wear a certified back protector.
    - The guest rule is for non-commercial flying and does not cover passenger (tandem) flights. Contact the local club before flying a new site.
  learners:
    - The A licence is the first level of Germany's state pilot licence. It combines basic training (training slope or winch) with high-altitude training.
    - The theory and practical exams are taken before a DHV examiner.
    - DHV runs an online school search, and its training department can help you choose a school.
  links:
