- code: DE
  name: Germany
  nationalBody:
    name: DHV (Deutscher Gleitschirmverband und Drachenflugverband)
    url: https://www.dhv.de/en/
  visitors:
    - If you live outside Germany, you can fly with your home licence plus an
      IPPI card at stage 4 or 5, and third-party liability insurance.
    - The guest rule is for non-commercial flying and does not cover tandem
      flights. Contact the local club before flying a new site.
  rulesUrl: https://www.dhv.de/en/dhv/german-flying-rules/
  learners:
    - The A licence is the first level of Germany's state pilot licence. It
      combines basic training (training slope or winch) with high-altitude
      training.
    - The theory and practical exams are taken before a DHV examiner.
    - DHV runs an online school search, and its training department can help you
      choose a school.
  links:
    - label: DHV (English)
      url: https://www.dhv.de/en/
    - label: DHV German flying rules (English)
      url: https://www.dhv.de/en/dhv/german-flying-rules/
