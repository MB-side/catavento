    - label: SHV airspace, DABS and NOTAM links
      url: https://www.shv-fsvl.ch/en/fluggebiete-sicherheit/fluggebiete/airspace/
    - label: SHV airspace map
      url: https://airspace.shv-fsvl.ch/map
    - label: burnair map
      url: https://www.burnair.ch/
    - label: "ParaglidingEarth: Switzerland"
      url: https://www.paraglidingearth.com/?country=ch
  sources:
