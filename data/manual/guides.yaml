- code: ID
  name: Indonesia
  nationalBody:
    name: Federasi Aero Sport Indonesia (FASI)
    url: https://pbfasi.id/
  visitors:
    - FASI's paragliding committee says all visiting and local pilots need current FASI Paralayang membership to fly legally in Indonesia.
    - The Visiting Pilot Membership is free for pilots with a current home-country licence, is best arranged before arrival, and is renewable once in any 3-month period.
    - For recreational flying, PB FASI asks visitors to email an FAI Sporting Licence, a valid national pilot licence, and valid international insurance, which it says is mandatory.
    - Visiting pilots may not fly tandems unless they hold a KITAS (stay permit) and FASI Paralayang approval; paid or instructional tandems are banned.
  learners:
    - FASI's paragliding committee advises finding an instructor or school near you, then joining a local paragliding club.
