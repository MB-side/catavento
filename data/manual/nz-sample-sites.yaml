# Iteration 1 New Zealand sample. Coordinates and wind directions come from ParaglidingEarth (pge layer,
# CC BY-SA 3.0 / ODbL 1.0) matched by name and region; if no confident match, leave the site without coordinates.
# `pgeIds` pins the ParaglidingEarth takeoffs checked by hand on 2026-10-12 (same name, same region).
# Port Hills has no single ParaglidingEarth entry (it is an area with many takeoffs), so it has none.
# Steward facts below are from the cited sources; confirm with the club before launch.
- name: Karioitahi Beach (HighSide)
  pgeIds: ["10879", "10880"] # "Karioitahi A" and "Karioitahi E"
  region: NZ-AUK
  steward: { legacyId: NZ-FP-001, role: flight_park }
  alsoAdministeredBy: { legacyId: NZ-CLB-007, note: "Auckland club publishes the site guide" }
  officialGuideUrl: https://www.cloudbase.org.nz/site-guide/coastal-soaring/flying-site-kariotahi
  siteAccessNote: "Subscription pass required (day, week, month or season); funds go to developing the flight park."
  stations: [station:holfuy:213]
  source: https://www.highside.nz   # was a Paragliding Map URL (wrong page, red tier): docs/10 C19
- name: Port Hills
