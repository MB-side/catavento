# Monthly outside-link check (D79): builds the site, checks every link to another website
# politely (robots.txt, one request per host at a time, 3 s apart), and saves the report to
# data/reports/external-links.json for the daily health check. Never blocks publishing.
name: Links

on:
  schedule:
    - cron: "0 18 1 * *" # 1st of the month, 04:00 AEST / 05:00 AEDT
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:external --json data/reports/external-links.json
      - name: Save the report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reports/external-links.json
          git commit -m "chore(data): outside-link report $(date -u +%Y-%m-%d)" || exit 0
          git pull --rebase
          git push
