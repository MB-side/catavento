# The daily check-in (docs/03 §5, D49): wakes once a day, runs only the providers whose own
# schedule says they are due (weekly, monthly...), commits the data if anything changed, then
# calls the publisher. Paused providers never run on the schedule.
name: Ingest

on:
  schedule:
    - cron: "30 16 * * *" # 02:30 AEST / 03:30 AEDT
  workflow_dispatch:
    inputs:
      provider:
        description: Run one provider only (leave empty for all providers that are due)
        type: string
        required: false
      force_collect:
        description: Collect now even if not due (with a provider named, even if paused)
        type: boolean
        default: false
      force_deploy:
        description: Publish even if no data changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Run providers
        env:
          PROVIDER: ${{ inputs.provider }}
          FORCE: ${{ inputs.force_collect && '--force' || '' }}
        run: |
          if [ -n "${PROVIDER:-}" ]; then pnpm ingest --provider "$PROVIDER" $FORCE; else pnpm ingest $FORCE; fi
      - run: pnpm build:data
      - name: Commit data changes
        id: commit
        run: |
          if [ -n "$(git status --porcelain -- data/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/
            git commit -m "chore(data): ingest $(date -u +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  deploy:
    needs: ingest
    if: needs.ingest.outputs.changed == 'true' || inputs.force_deploy
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.ingest.outputs.sha }}
